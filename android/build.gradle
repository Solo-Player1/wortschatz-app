// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Only build-tools 36.0.0 is installed locally (the SDK manager cannot download from this network),
// so every Android module (app + Capacitor plugins) must use it instead of AGP's default 35.0.0.
subprojects {
    plugins.withId('com.android.application') { android { buildToolsVersion = '36.0.0' } }
    plugins.withId('com.android.library') { android { buildToolsVersion = '36.0.0' } }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
